name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Unzip Project
      run: |
        unzip -q angel-ai-features-request.zip
        echo "=== Files after unzip ==="
        ls -la

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    1 Run find -name "gradlew" -exec chmod +x {} +
    
        GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -z "$GRADLE_PATH" ]; then
          echo "Gradlew not found! Checking directory contents:"
          find . -maxdepth 3
          exit 1
        fi
        PROJECT_DIR=$(dirname "$GRADLE_PATH")
        echo "Building in directory: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AngelAI-APK
        path: "**/app/build/outputs/apk/debug/*.apk"

      
