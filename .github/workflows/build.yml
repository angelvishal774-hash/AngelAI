name: Build Android APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Unzip Project
      run: |
        unzip -q angel-ai-features-request.zip
        ls -la

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build APK
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "gradlew found nowhere, using system gradle"
          gradle assembleDebug
        else
          DIR=$(dirname "$GRADLEW_PATH")
          echo "Found gradlew in $DIR"
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: AngelAI-APK
        path: "**/app/build/outputs/apk/debug/*.apk"
        
